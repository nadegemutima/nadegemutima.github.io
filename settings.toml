  "https://x.com/MutimaNadege",
  "https://www.linkedin.com/in/nad%C3%A8ge-bizimungu-9a944a198/",
]

# ── Photos and files ────────────────────────────────────────
#
# Upload files to the "media" folder on GitHub, then write the
# file's name here.

banner_photo = "media/mutima.jpg"   # A portrait or banner photo of you
resume = ""         # A PDF of your resume (adds a Resume button)
favicon = ""                        # Tiny browser-tab icon. Empty = made for you

# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """

I'm a journalism student at UC Berkeley, originally from Kigali, Rwanda. I grew up learning how media shaped the story of the 1994 genocide against the Tutsi — both the propaganda that fueled it and the way international coverage got it wrong afterward. That's where my interest in who gets to tell a story, and how, started. 

I spent four years as a freelance multimedia reporter and producer across East Africa and the Middle East. At Doha News, I covered the 2022 World Cup in Qatar alongside politics, human rights and sports more broadly. I've also reported for the Associated Press, Al Jazeera English and Minority Africa, on stories that sit at the intersection of politics, culture and human rights. I hold a B.S. in Journalism  from Northwestern's Medill School (2022). 

When I finish my degree, I hope to go back to East Africa to report on displacement, conflict and the policies that drive migration. When I'm not working, I'm usually outside, either on a trail hiking somewhere or out for a run trying to to clear my head before the next story.


"""

